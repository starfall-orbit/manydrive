workflows:
  android-debug:
    name: ManyDrive Android Debug
    # Available on Codemagic personal accounts without billing enabled.
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Set up Android SDK
        script: |
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Build debug APK
        script: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  android-release:
    name: ManyDrive Android Release
    # Available on Codemagic personal accounts without billing enabled.
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      java: 17
      groups:
        - github_release
      vars:
        GITHUB_RELEASE_REPO: starfall-org/manydrive
      android_signing:
        # Must match the Reference name in Codemagic's Android keystores tab.
        - ManyDrive
    scripts:
      - name: Set up Android SDK
        script: |
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Check release signing credentials
        script: |
          set -eu
          : "${CM_KEYSTORE_PATH:?Missing keystore path}"
          : "${CM_KEYSTORE_PASSWORD:?Missing keystore password}"
          : "${CM_KEY_ALIAS:?Missing key alias}"
          : "${CM_KEY_PASSWORD:?Missing key password}"
          test -f "$CM_KEYSTORE_PATH"
      - name: Prepare GitHub release publishing
        script: |
          set -eu
          GITHUB_RELEASE_TOKEN="${GH_TOKEN:-${GITHUB_TOKEN:-}}"
          : "${GITHUB_RELEASE_TOKEN:?Set secret GITHUB_TOKEN (or GH_TOKEN) in environment group github_release}"
          if ! command -v gh >/dev/null 2>&1; then
            brew install gh --quiet
          fi
      - name: Build ABI-specific release APKs and AAB
        script: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace
      - name: Publish APKs and AAB to GitHub Release
        script: |
          bash scripts/publish-github-release.sh
    artifacts:
      - app/build/outputs/apk/release/*.apk
      - app/build/outputs/bundle/release/*.aab
